<!doctype html><html><body style="margin:0;background:#1a1424">
<canvas id="c"></canvas>
<script src="../js/pixel.js"></script><script src="../js/sprites.js"></script><script src="../js/walkers.js"></script><script src="../js/interiors.js"></script>
<script>
const ids=(new URLSearchParams(location.search).get('ids')||Object.keys(INTERIORS).join(',')).split(','),S=2,cw=37*16,ch=21*16;
const c=document.getElementById('c');c.width=3*cw*S;c.height=Math.ceil(ids.length/3)*ch*S;
const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.scale(S,S);
ids.forEach((id,i)=>{const m=INTERIORS[id];const ox=(i%3)*cw+4,oy=Math.floor(i/3)*ch+4;
 x.drawImage(m.staticCanvas(),ox,oy);
 const list=m.drawables().slice();
 list.push({y:m.spawn[1]*16+12,img:WALKERS.get('player','up',0),x:m.spawn[0]*16,top:m.spawn[1]*16-11});
 list.sort((a,b)=>a.y-b.y).forEach(d=>x.drawImage(d.img,ox+d.x,oy+d.top));});
</script></body></html>
